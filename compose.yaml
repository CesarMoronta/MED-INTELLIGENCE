services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: "Proyecto123!"
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'Proyecto123!' -C -Q 'SELECT 1' >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  database-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    volumes:
      - ./database_schema.txt:/schema/database_schema.sql:ro
    depends_on:
      sqlserver:
        condition: service_healthy
    command:
      - /bin/bash
      - -c
      - /opt/mssql-tools18/bin/sqlcmd -S sqlserver -U sa -P 'Proyecto123!' -C -b -i /schema/database_schema.sql
    restart: "no"

  app:
    build: .
    env_file:
      - path: .env
        format: raw
    environment:
      SQLSERVER_CONN: "DRIVER={ODBC Driver 18 for SQL Server};SERVER=sqlserver,1433;DATABASE=MedIntelligence;UID=sa;PWD=Proyecto123!;Encrypt=yes;TrustServerCertificate=yes"
      UPLOAD_FOLDER: /app/static/uploads
      FLASK_DEBUG: "0"
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/static/uploads
    depends_on:
      database-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  sqlserver_data:
  uploads:
