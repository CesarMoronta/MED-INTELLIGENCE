<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MED-INTELLIGENCE PRO — Acceso Seguro</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="description"
    content="Sistema Médico Inteligente con diagnóstico bayesiano. Acceso exclusivo para personal médico autorizado." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="/css/login.css?v=20260802d" />
</head>

<body>
  <div class="bg-scene"></div>
  <div class="bg-grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <div class="login-wrapper">
    <div class="login-card">

      <div class="login-header">
        <div class="logo-ring">
          <svg viewBox="0 0 24 24" fill="none" stroke="#3b82f6" stroke-width="1.5" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2" />
          </svg>
        </div>
        <div class="login-title">MED-INTELLIGENCE PRO</div>
        <div class="login-subtitle">Sistema Médico con IA Bayesiana</div>
        <div class="login-desc">Acceso restringido al personal médico autorizado.<br>Todas las sesiones son auditadas.
        </div>
      </div>

      <!-- Alert de errores -->
      <div id="alert-box" style="display:none;"></div>

      <!-- Barra de intentos fallidos -->
      <div class="attempt-bar" id="attempt-bar" style="display:none;">
        <div class="attempt-label">
          <span>Intentos fallidos</span>
          <span id="attempt-count">0 / 5</span>
        </div>
        <div class="attempt-track">
          <div class="attempt-fill" id="attempt-fill" style="width:0%; background:#10b981;"></div>
        </div>
      </div>

      <form id="login-form" autocomplete="off">

        <div class="form-group">
          <label class="form-label" for="username">Usuario</label>
          <div class="input-wrap">
            <input type="text" id="username" class="form-input" placeholder="Ingresa tu usuario" autocomplete="username"
              required />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round"
              style="pointer-events:none;position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
              <circle cx="12" cy="7" r="4" />
            </svg>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Contraseña</label>
          <div class="input-wrap">
            <input type="password" id="password" class="form-input" placeholder="Ingresa tu contraseña"
              autocomplete="current-password" required />
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
              stroke-linejoin="round"
              style="pointer-events:none;position:absolute;left:14px;top:50%;transform:translateY(-50%);width:18px;height:18px;">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
              <path d="M7 11V7a5 5 0 0 1 10 0v4" />
            </svg>
          </div>
        </div>

        <button type="submit" class="btn-login" id="login-btn">
          <span class="btn-text">Iniciar Sesión</span>
          <div class="btn-spinner">
            <div class="spinner"></div>
          </div>
        </button>

      </form>



      <div class="login-footer">
        <div>UTESA © 2026 — Informática Médica · Proyecto Integrador</div>
        <div class="security-badges">
          <div class="badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z" />
            </svg>
            Sesiones cifradas
          </div>
          <div class="badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 8v4l3 3" />
            </svg>
            Expiración 8h
          </div>
          <div class="badge">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M9 12l2 2 4-4" />
              <path d="M21 12c0 4.97-4.03 9-9 9s-9-4.03-9-9 4.03-9 9-9 9 4.03 9 9z" />
            </svg>
            Auditoría activa
          </div>
        </div>
      </div>

    </div>
  </div>



  <script src="/js/login.js?v=3"></script>
</body>

</html>
